name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r skills/vensim-skill/requirements/dev.txt
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m bandit -r skills/vensim-skill/scripts -q
      - name: Check POSIX wrapper
        if: runner.os != 'Windows'
        run: bash skills/vensim-skill/skill.sh doctor
      - name: Check Windows wrapper
        if: runner.os == 'Windows'
        shell: cmd
        run: skills\vensim-skill\skill.cmd doctor
  integrations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r skills/vensim-skill/requirements/dev.txt -r skills/vensim-skill/requirements/pysd.txt -r skills/vensim-skill/requirements/mcp.txt -r skills/vensim-skill/requirements/plots.txt -r skills/vensim-skill/requirements/analysis.txt
      - run: python -m pytest -q -p no:cacheprovider
      - if: runner.os == 'Linux'
        run: shellcheck skills/vensim-skill/skill.sh
